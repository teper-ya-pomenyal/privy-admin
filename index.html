<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#111313" />
    <title>privy/stream · admin</title>
    <script>
      // Тема до первой отрисовки (основной механизм — initTheme в main.tsx):
      // тёмный графит по умолчанию, светлый — по выбору из localStorage.
      try {
        var t = localStorage.getItem('privy.admin.theme');
        document.documentElement.dataset.theme = t === 'light' || t === 'dark' ? t : 'dark';
      } catch (e) {
        document.documentElement.dataset.theme = 'dark';
      }
    </script>
    <!-- Шрифты — локально через @fontsource (см. styles.css), без внешних запросов -->
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
